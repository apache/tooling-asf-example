github:
  dependabot_alerts: true
  dependabot_updates: false
  rulesets:
    - name: "Main branch"
      type: branch
      branches:
        includes:
          - "main"
    - name: "Release tags"
      target: tag
      enforcement: active
      conditions:
        ref_name:
          include:
            - "refs/tags/v*"
          exclude: []
      rules:
        - type: update
        - type: deletion
  environments:
    pypi:
      deployment_branch_policy:
        policies:
          - name: "v*"
            type: tag

notifications:
  commits: commits@tooling.apache.org
  issues: issues@tooling.apache.org
  pullrequests: issues@tooling.apache.org
