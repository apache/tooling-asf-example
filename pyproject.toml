[build-system]
requires      = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name            = "asfexample"
# This is automatically updated
version         = "0.0.1.dev0+dev"
description     = "Example package for ASF Tooling"
readme          = "README.md"
requires-python = ">=3.13"
license         = "Apache-2.0"
license-files   = ["LICENSE", "NOTICE"]
authors         = [{name = "ASF Tooling", email = "dev@tooling.apache.org"}]
classifiers     = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
    "pygit2>=1.18.1",
    "tomlkit>=0.13.3",
]

[project.scripts]
asfexample = "asfexample:main"

[dependency-groups]
dev = ["prek", "pyright", "pytest", "ruff", "zizmor"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = []
select = [
  "ASYNC", # flake8-async
  "C90",   # cyclomatic-complexity
  "E",     # pycodestyle
  "F",     # pyflakes
  "I",     # isort
  "N",     # pep8-naming
  "RUF",   # ruff-checks
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "UP",    # pyupgrade
  "W"      # pycodestyle warning
]

[tool.uv]
# This is automatically updated
exclude-newer = "5 days"
