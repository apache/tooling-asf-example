name: Analyze using prek hooks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"

      - name: Run prek
        run: uv run --locked prek run --show-diff-on-failure --color=always --all-files
        env:
          PREK_SKIP: version

      - name: Run pyright
        run: uv run --locked pyright

      - name: Run zizmor
        run: uv run --locked zizmor --min-severity low --offline .github
