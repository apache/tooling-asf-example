name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
      - run: uv run --locked --no-default-groups --group test pytest
        env:
          UV_PYTHON: ${{ matrix.python }}

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "latest-known"
      - run: uv run --locked python -I scripts/check_version.py
        env:
          PRE_COMMIT_FROM_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRE_COMMIT_TO_REF: ${{ github.sha }}
      - run: uv run --locked python -I scripts/check_uv_pins.py
      - run: uv run --locked prek run --show-diff-on-failure --color=always --all-files
        env:
          PREK_SKIP: version
      - run: uv run --locked pyright
      - run: uv run --locked zizmor --min-severity low --offline .github
