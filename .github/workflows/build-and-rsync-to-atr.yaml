name: build-and-rsync-to-atr
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        type: string
permissions: { contents: read }

jobs:
  build-and-upload:
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout (shallow, no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build dists (sdist + wheel) in python:3.12-slim
        run: |
          set -euxo pipefail
          docker run --rm -v "$PWD:/work" -w /work python:3.12-slim bash -lc '
            set -euxo pipefail
            python -m pip install -U pip build
            python -m build --sdist --wheel
          '

      - name: Show dist hashes
        run: |
          set -euxo pipefail
          ls -l dist
          sha256sum dist/*

      - name: Upload to ATR using a local composite action
        uses: apache/tooling-actions/upload-to-atr@b9819f85624ebe71db74d67f8a1f48cc962f83a8
        with:
          project: tooling
          version: ${{ inputs.version }}
          atr-host: tooling-vm-ec2-de.apache.org
          ssh-port: 2223
